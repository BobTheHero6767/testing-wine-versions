name: Build winecx26.2
on:
  workflow_dispatch:
    inputs:
      version:
        description: CrossOver source version
        required: true
      dxmt_ref:
        description: DXMT branch or tag (3Shain/DXMT)
        required: false
        default: main

jobs:
  build:
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Make scripts executable
        run: chmod +x ./scripts/build-wine.sh

      - name: Install dependencies
        run: |
          brew install bison ccache gettext mingw-w64 pkgconfig \
            freetype gnutls libpcap sdl2 molten-vk \
            vulkan-loader vulkan-headers cmake ninja

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: winecx-${{ inputs.version }}

      - name: Build Wine
        run: ./scripts/build-wine.sh "${{ inputs.version }}"

      - name: Clone DXMT
        run: |
          git clone --depth 1 --recurse-submodules \
            --branch "${{ inputs.dxmt_ref }}" \
            https://github.com/3Shain/DXMT.git dxmt-src

      - name: Build DXMT
        run: |
          cmake -S dxmt-src -B dxmt-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -GNinja
          ninja -C dxmt-build

      - name: Bundle DXMT into Wine app
        run: |
          APPNAME="Wine Crossover ${{ inputs.version }}"
          INJECT_DIR="dxmt-inject"
          mkdir -p "${INJECT_DIR}"

          tar -xzf "winecx-${{ inputs.version }}-osx64.tar.gz" -C "${INJECT_DIR}"

          WINE_ROOT="${INJECT_DIR}/${APPNAME}.app/Contents/Resources/wine"

          # winemetal.dylib → lib/wine/x86_64-unix/winemetal.so
          # Wine loads this as the native macOS bridge at runtime
          mkdir -p "${WINE_ROOT}/lib/wine/x86_64-unix"
          WINEMETAL=$(find dxmt-build -name "winemetal.dylib" | head -1)
          cp "${WINEMETAL}" "${WINE_ROOT}/lib/wine/x86_64-unix/winemetal.so"

          # Windows PE DLLs → share/dxmt/x86_64
          # Launcher copies these into the prefix's system32 at runtime
          mkdir -p "${WINE_ROOT}/share/dxmt/x86_64"
          find dxmt-build -name "*.dll" -exec cp {} "${WINE_ROOT}/share/dxmt/x86_64/" \;

          # Re-sign after modifying the bundle
          codesign --force --deep --sign - "${INJECT_DIR}/${APPNAME}.app"

          tar -C "${INJECT_DIR}" -czf "winecx-${{ inputs.version }}-osx64.tar.gz" "${APPNAME}.app"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: winecx ${{ inputs.version }}
          files: winecx-${{ inputs.version }}-osx64.tar.gz
          fail_on_unmatched_files: true
